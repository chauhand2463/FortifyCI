services:
  postgres:
    image: postgres:17-alpine
    container_name: fortifyci-postgres
    environment:
      POSTGRES_DB: fortifyci
      POSTGRES_USER: fortifyci
      POSTGRES_PASSWORD: fortifyci_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortifyci"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fortifyci-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fortifyci-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fortifyci-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: fortifyci-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - fortifyci-network
    restart: unless-stopped

  backend:
    build:
      context: ./scssp
      dockerfile: Dockerfile
    container_name: fortifyci-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://fortifyci:fortifyci_password@postgres:5432/fortifyci
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      TRIVY_CACHE_DIR: /app/.trivy-cache
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      FORGOT_PASSWORD_URL: http://localhost:4000/forgot-password
    ports:
      - "3000:3000"
    volumes:
      - trivy_cache:/app/.trivy-cache
      - report_output:/app/reports
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fortifyci-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/scssp
      dockerfile: Dockerfile
    container_name: fortifyci-frontend
    environment:
      BACKEND_URL: http://backend:3000
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "4000:4000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fortifyci-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  trivy_cache:
  report_output:

networks:
  fortifyci-network:
    driver: bridge
